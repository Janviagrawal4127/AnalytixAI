# render.yaml — Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: analytixai-backend
    runtime: python
    region: oregon
    plan: free
    pythonVersion: "3.12.0"

    # Build: install uv then do a locked install from uv.lock
    buildCommand: pip install uv && uv sync --frozen

    # Start: uvicorn via uv run
    startCommand: uv run uvicorn backend.server:app --host 0.0.0.0 --port $PORT

    # Health check — Render pings this to confirm service is up
    healthCheckPath: /api/health

    # Auto-deploy on every push to main
    autoDeploy: true

    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set these in Render Dashboard → Environment (keep secrets out of code):
      # - key: Groq_API
      #   value: gsk_your_key_here
      # - key: SUPABASE_URL
      #   value: https://yourproject.supabase.co
      # - key: SUPABASE_KEY
      #   value: your_anon_key
      # - key: ALLOWED_ORIGINS
      #   value: https://your-app.vercel.app,http://localhost:3000
