# render.yaml — Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: analytixai-backend
    runtime: python
    region: oregon  # or singapore / frankfurt — pick closest to your users
    plan: free      # change to "starter" for always-on (no sleep)

    # Build: install uv then sync all dependencies
    buildCommand: pip install uv && uv sync

    # Start: use `uv run` — it automatically activates the venv and finds uvicorn
    startCommand: uv run uvicorn backend.server:app --host 0.0.0.0 --port $PORT

    # Health check — Render pings this to confirm service is up
    healthCheckPath: /api/health

    # Auto-deploy on every push to main
    autoDeploy: true

    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      # Add these in Render Dashboard → Environment (keep secrets out of code):
      # - key: Groq_API
      #   value: gsk_your_key_here
      # - key: SUPABASE_URL
      #   value: https://yourproject.supabase.co
      # - key: SUPABASE_KEY
      #   value: your_anon_key
