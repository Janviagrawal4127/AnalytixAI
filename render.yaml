# render.yaml - Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: analytixai-klw3
    runtime: python
    region: oregon
    plan: free
    pythonVersion: "3.12.0"

    # Build: install from pinned requirements.txt
    buildCommand: pip install -r requirements.txt

    # Start: run uvicorn directly via python module
    startCommand: python -m uvicorn backend.server:app --host 0.0.0.0 --port $PORT

    # Health check - Render pings this to confirm service is up
    healthCheckPath: /api/health

    # Auto-deploy on every push to main
    autoDeploy: true

    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set these in Render Dashboard -> Environment (keep secrets out of code):
      # - key: Groq_API
      #   value: gsk_your_key_here
      # - key: SUPABASE_URL
      #   value: https://yourproject.supabase.co
      # - key: SUPABASE_KEY
      #   value: your_anon_key
      # - key: ALLOWED_ORIGINS
      #   value: https://your-app.vercel.app,http://localhost:3000
